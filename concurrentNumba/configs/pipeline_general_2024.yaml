base_config: ../../configs/pipeline_general_2024_base.yaml

runs:
  n_runs: 5

execution:
  max_workers: 16

phase1_clean:
  use_numba: true
  sampling:
    method: fast_hash   # "sha1" for sequential-equivalent, "fast_hash" for Numba-accelerated
    stage: canonical
  stats:
    compute_median: false
    use_pandas_if_rows_lt: 0

phase2_graph:
  use_numba: true

phase3_algos:
  use_numba: true

phase4_score:
  use_numba: true
